[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-soc-tools"
version = "0.1.0"
description = "Local, read-only security log analysis tools exposed through MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hazem Mohamed" }]
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
mcp-soc-tools = "mcp_soc_tools.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8"]

